<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NightHawks Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen p-6">
    <div class="max-w-2xl mx-auto space-y-6">
        <h1 class="text-2xl font-bold text-indigo-400 border-b border-gray-800 pb-3">⚙️ NightHawks Admin Control Panel</h1>

        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-lg space-y-4">
            <h2 class="text-lg font-bold text-gray-200">App Settings & Notice</h2>
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">bKash Number</label>
                <input type="text" id="setBkash" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">WhatsApp Number</label>
                <input type="text" id="setWhatsapp" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">Top Notice Text</label>
                <input type="text" id="setNotice" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white">
            </div>
            <button onclick="updateSettings()" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/30">Save Settings</button>
        </div>

        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-lg space-y-4">
            <h2 class="text-lg font-bold text-gray-200">Publish Room ID & Password</h2>
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">Tournament ID</label>
                <input type="number" id="tId" value="1" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">Room Pass (e.g., ID: 12345, Pass: nhk123)</label>
                <input type="text" id="roomPassInput" placeholder="Enter Room ID & Pass" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white">
            </div>
            <button onclick="updateRoomPass()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-2.5 rounded-xl transition shadow-lg shadow-emerald-600/30">Publish Room Pass</button>
        </div>

        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-lg space-y-4">
            <h2 class="text-lg font-bold text-gray-200">Cancel & Refund Match</h2>
            <button onclick="refundMatch()" class="w-full bg-rose-600 hover:bg-rose-500 font-bold py-2.5 rounded-xl transition shadow-lg shadow-rose-600/30">Refund Entry Fees (Tournament ID: 1)</button>
        </div>
    </div>

    <script>
        async function updateSettings() {
            const data = {
                bkashNumber: document.getElementById('setBkash').value,
                whatsappNumber: document.getElementById('setWhatsapp').value,
                topNotice: document.getElementById('setNotice').value
            };
            const res = await fetch('/api/settings/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            alert(result.message);
        }

        async function updateRoomPass() {
            const data = {
                tournamentId: document.getElementById('tId').value,
                roomPass: document.getElementById('roomPassInput').value
            };
            const res = await fetch('/api/admin/roompass', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            alert(result.message);
        }

        async function refundMatch() {
            if(!confirm("Are you sure you want to refund all players?")) return;
            const res = await fetch('/api/admin/refund', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tournamentId: 1 })
            });
            const result = await res.json();
            alert(result.message);
        }
    </script>
</body>
</html>

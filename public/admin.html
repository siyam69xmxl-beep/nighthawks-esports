<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NightHawks Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>body { background-color: #030712; color: #f3f4f6; font-family: sans-serif; }</style>
</head>
<body class="p-6">
    <div class="max-w-6xl mx-auto space-y-6">
        <header class="flex justify-between items-center bg-slate-900 border border-slate-800 p-4 rounded-2xl">
            <h1 class="text-xl font-bold text-red-500">NIGHTHAWKS ADMIN CONTROL PANEL</h1>
            <a href="/" target="_blank" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-gray-300">লাইভ অ্যাপ দেখুন</a>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- নতুন ম্যাচ অ্যাড -->
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
                <h2 class="font-bold text-white text-base">১. নতুন টুর্নামেন্ট ম্যাচ অ্যাড করুন</h2>
                <input type="text" id="matchTitle" placeholder="ম্যাচের নাম (যেমন: Grand Clash #2)" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl text-xs text-white">
                <div class="grid grid-cols-2 gap-2">
                    <select id="matchCategory" class="bg-slate-800 border border-slate-700 p-3 rounded-xl text-xs text-white">
                        <option value="Clash Squad">Clash Squad</option>
                        <option value="Bermuda">Bermuda</option>
                        <option value="Lone Wolf">Lone Wolf</option>
                    </select>
                    <input type="text" id="subCategory" placeholder="ট্যাগ (যেমন: 4v4 / SOLO)" class="bg-slate-800 border border-slate-700 p-3 rounded-xl text-xs text-white">
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <input type="text" id="prizePool" placeholder="প্রাইজপুল (৳)" class="bg-slate-800 border border-slate-700 p-3 rounded-xl text-xs text-white">
                    <input type="text" id="perKill" placeholder="পার কিল (৳)" class="bg-slate-800 border border-slate-700 p-3 rounded-xl text-xs text-white">
                    <input type="text" id="entryFee" placeholder="এন্ট্রি ফি (৳)" class="bg-slate-800 border border-slate-700 p-3 rounded-xl text-xs text-white">
                </div>
                <input type="text" id="matchTime" placeholder="সময় (যেমন: Tonight 09:00 PM)" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl text-xs text-white">
                <button onclick="publishMatch()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl text-xs">ম্যাচ পাবলিশ করুন</button>
            </div>

            <!-- রিফান্ড ও ওয়ালেট কন্ট্রোল -->
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
                <h2 class="font-bold text-white text-base">২. প্লেয়ার রিফান্ড ও ওয়ালেট অ্যাডJustment</h2>
                <input type="text" id="refundUser" placeholder="ইউজারনেম লিখুন" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl text-xs text-white">
                <input type="number" id="refundAmount" placeholder="টাকার পরিমাণ (৳)" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl text-xs text-white">
                <input type="text" id="refundMsg" placeholder="বার্তা (যেমন: ম্যাচ ক্যানসেলের রিফান্ড টাকা)" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl text-xs text-white">
                <button onclick="sendRefund()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-xs">রিফান্ড ও নোটিফিকেশন পাঠান</button>
            </div>
        </div>

        <!-- রুম আইডি ও সেটিংস চেঞ্জার -->
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
            <h2 class="font-bold text-white text-base">৩. অ্যাপের বিকাশ ও ওয়াটসঅ্যাপ নাম্বার আপডেট</h2>
            <div class="grid grid-cols-2 gap-3">
                <input type="text" id="setBkash" placeholder="নতুন বিকাশ নাম্বার" class="bg-slate-800 border border-slate-700 p-3 rounded-xl text-xs text-white">
                <input type="text" id="setWhatsapp" placeholder="নতুন ওয়াটসঅ্যাপ নাম্বার" class="bg-slate-800 border border-slate-700 p-3 rounded-xl text-xs text-white">
            </div>
            <textarea id="setNotice" placeholder="টপ নোটিশ বার্তা লিখুন..." class="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl text-xs text-white h-20"></textarea>
            <button onclick="updateSettings()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-xs">সেটিংস সেভ করুন</button>
        </div>
    </div>

    <script>
        async function publishMatch() {
            let data = {
                title: document.getElementById('matchTitle').value,
                category: document.getElementById('matchCategory').value,
                subCategory: document.getElementById('subCategory').value,
                prizePool: document.getElementById('prizePool').value,
                perKill: document.getElementById('perKill').value,
                entryFee: document.getElementById('entryFee').value,
                time: document.getElementById('matchTime').value,
                totalSlots: 8
            };
            let res = await fetch('/api/tournaments/add', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            let result = await res.json();
            alert(result.message);
        }

        async function sendRefund() {
            let data = {
                username: document.getElementById('refundUser').value.trim(),
                amount: document.getElementById('refundAmount').value,
                message: document.getElementById('refundMsg').value
            };
            let res = await fetch('/api/admin/refund', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            let result = await res.json();
            alert(result.message);
        }

        async function updateSettings() {
            let data = {
                bkashNumber: document.getElementById('setBkash').value,
                whatsappNumber: document.getElementById('setWhatsapp').value,
                topNotice: document.getElementById('setNotice').value
            };
            let res = await fetch('/api/settings/update', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            let result = await res.json();
            alert(result.message);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NightHawks E-Sports</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen">
    
    <header class="bg-gray-900 border-b border-gray-800 p-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-lg border-2 border-indigo-400">NH</div>
            <h1 class="text-xl font-bold tracking-wider text-indigo-400">NightHawks E-Sports</h1>
        </div>
        <div class="flex items-center space-x-4 bg-gray-800 px-4 py-2 rounded-xl border border-gray-700">
            <span class="text-sm font-medium">Player: <span id="userName" class="text-indigo-300 font-bold">NHK-SH1HAB</span></span>
            <span class="text-sm font-medium">Balance: <span id="userBalance" class="text-emerald-400 font-bold">৳150</span></span>
        </div>
    </header>

    <div id="topNoticeBar" class="bg-indigo-950 border-b border-indigo-900 text-indigo-200 px-4 py-2 text-center text-sm">
        Loading notice...
    </div>

    <main class="max-w-4xl mx-auto p-4 mt-4">
        <h2 class="text-xl font-bold mb-4 border-l-4 border-indigo-500 pl-3">Active Tournaments</h2>
        <div id="tournamentList" class="space-y-4"></div>
    </main>

    <div id="joinModal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
            <h3 id="modalTitle" class="text-lg font-bold text-indigo-400 mb-3">Join Match</h3>
            <p class="text-sm text-gray-400 mb-4">Select mode and enter details:</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">SELECT MODE</label>
                    <select id="joinMode" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                        <option value="SOLO">Solo (সোলো)</option>
                        <option value="DUO">Duo (ডুও)</option>
                        <option value="SQUAD">Squad (স্কোয়াড)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">IN-GAME NAME (IGN)</label>
                    <input type="text" id="gameName" value="NHK-SH1HAB" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">FREE FIRE UID</label>
                    <input type="text" id="gameUid" placeholder="Enter your UID" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <div class="flex space-x-3 mt-6">
                <button onclick="closeJoinModal()" class="w-1/2 bg-gray-800 hover:bg-gray-700 text-gray-300 font-semibold py-2.5 rounded-xl transition">Cancel</button>
                <button onclick="confirmJoin()" class="w-1/2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/30">Confirm & Pay</button>
            </div>
        </div>
    </div>

    <script>
        let selectedTournamentId = null;
        const currentUserId = "guest_user";

        async function loadData() {
            try {
                const settingsRes = await fetch('/api/settings');
                const settingsData = await settingsRes.json();
                if(settingsData.success) {
                    document.getElementById('topNoticeBar').innerText = settingsData.settings.topNotice;
                }

                const userRes = await fetch(`/api/user/${currentUserId}`);
                const userData = await userRes.json();
                if(userData.success) {
                    document.getElementById('userBalance').innerText = `৳${userData.user.balance}`;
                    document.getElementById('userName').innerText = userData.user.name;
                }

                const tRes = await fetch('/api/tournaments');
                const tData = await tRes.json();
                if(tData.success) {
                    let html = '';
                    tData.tournaments.forEach(t => {
                        html += `
                        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-lg relative">
                            <div class="flex justify-between items-start mb-3">
                                <div>
                                    <h3 class="text-lg font-bold text-indigo-300">${t.title}</h3>
                                    <div class="flex space-x-2 mt-1">
                                        <span class="bg-indigo-950 text-indigo-300 text-xs px-2.5 py-1 rounded-md font-semibold">${t.type}</span>
                                        <span class="bg-gray-800 text-gray-300 text-xs px-2.5 py-1 rounded-md font-semibold">${t.map}</span>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <span class="text-xs text-gray-400 block">Entry Fee</span>
                                    <span class="text-emerald-400 font-extrabold text-base">৳${t.entryFee}</span>
                                </div>
                            </div>
                            
                            <div class="grid grid-cols-2 gap-2 my-4 text-sm bg-gray-950/50 p-3 rounded-xl border border-gray-800/60">
                                <div><span class="text-gray-400">Prize Pool:</span> <strong class="text-indigo-400">৳${t.prizePool}</strong></div>
                                <div><span class="text-gray-400">Per Kill:</span> <strong class="text-indigo-400">৳${t.perKill}</strong></div>
                                <div class="col-span-2 mt-1"><span class="text-gray-400">Time:</span> <strong class="text-gray-200">${t.time}</strong></div>
                            </div>

                            <div class="flex space-x-2">
                                <button onclick="openJoinModal(${t.id}, '${t.title}')" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 px-4 rounded-xl transition shadow-md shadow-indigo-600/30">
                                    Join Match
                                </button>
                                <button onclick="alert('Room Password: ${t.roomPass}')" class="bg-gray-800 hover:bg-gray-700 text-indigo-300 font-semibold py-2.5 px-4 rounded-xl border border-gray-700 transition">
                                    🔑 Room Pass
                                </button>
                            </div>
                        </div>`;
                    });
                    document.getElementById('tournamentList').innerHTML = html;
                }
            } catch (err) {
                console.error("Error loading data:", err);
            }
        }

        function openJoinModal(id, title) {
            selectedTournamentId = id;
            document.getElementById('modalTitle').innerText = `Join ${title}`;
            document.getElementById('joinModal').classList.remove('hidden');
        }

        function closeJoinModal() {
            document.getElementById('joinModal').classList.add('hidden');
        }

        async function confirmJoin() {
            const mode = document.getElementById('joinMode').value;
            const gameName = document.getElementById('gameName').value;
            const gameUid = document.getElementById('gameUid').value;

            if(!gameUid) {
                alert("Please enter your Free Fire UID!");
                return;
            }

            const res = await fetch('/api/tournament/join', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tournamentId: selectedTournamentId, userId: currentUserId, mode, gameName, gameUid })
            });
            const data = await res.json();
            alert(data.message);
            if(data.success) {
                closeJoinModal();
                loadData();
            }
        }

        loadData();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NightHawks E-Sports</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; background: #161b22; border-radius: 10px; margin-bottom: 25px; border: 1px solid #30363d; }
        header h1 { color: #58a6ff; font-size: 24px; }
        .user-info { font-size: 14px; color: #8b949e; }
        .container { max-width: 1000px; margin: 0 auto; }
        h2 { margin-bottom: 15px; color: #f0f6fc; border-bottom: 2px solid #21262d; padding-bottom: 8px; }
        .tournament-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 18px; transition: 0.2s; }
        .card:hover { border-color: #58a6ff; transform: translateY(-2px); }
        .card h3 { color: #58a6ff; margin-bottom: 10px; }
        .card p { font-size: 14px; margin: 5px 0; color: #8b949e; }
        .card p span { color: #f0f6fc; font-weight: bold; }
        .join-btn { display: block; width: 100%; padding: 10px; margin-top: 15px; background: #238636; color: white; text-align: center; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; }
        .join-btn:hover { background: #2ea043; }
        .no-data { color: #8b949e; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>NightHawks E-Sports</h1>
            <div class="user-info">
                <span>User: Guest</span> | <span>Balance: ৳0</span>
            </div>
        </header>

        <h2>Active Tournaments</h2>
        <div id="tournament-list" class="tournament-grid">
            <p class="no-data">টুর্নামেন্ট লোড হচ্ছে...</p>
        </div>
    </div>

    <script>
        async function loadTournaments() {
            try {
                const res = await fetch('/api/tournaments');
                const tournaments = await res.json();
                const list = document.getElementById('tournament-list');
                
                if (!tournaments || tournaments.length === 0) {
                    list.innerHTML = '<p class="no-data">বর্তমানে কোনো টুর্নামেন্ট চালু নেই। অ্যাডমিন প্যানেল থেকে তৈরি করুন!</p>';
                    return;
                }

                list.innerHTML = tournaments.map(t => `
                    <div class="card">
                        <h3>${t.title}</h3>
                        <p>টাইপ: <span>${t.type}</span></p>
                        <p>ম্যাপ: <span>${t.map}</span></p>
                        <p>প্রাইজপুল: <span>৳${t.prizePool}</span></p>
                        <p>পার কিল: <span>৳${t.perKill}</span></p>
                        <p>এন্ট্রি ফি: <span>৳${t.entryFee}</span></p>
                        <p>সময়: <span>${t.time}</span></p>
                        <a href="#" class="join-btn">Join Match</a>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('tournament-list').innerHTML = '<p class="no-data">টুর্নামেন্ট লোড করতে সমস্যা হচ্ছে!</p>';
            }
        }

        loadTournaments();
    </script>
</body>
</html>
